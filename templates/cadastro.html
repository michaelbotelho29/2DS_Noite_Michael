<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h2>Novo Cadastro</h2>
        <form action="/salvar" method="post">

            <label>Usuário</label>
            <input type="text" name="campo_usuario" required>

            <label>Senha</label>
            <input type="text" name="campo_senha" required>

            <label>CNPJ</label>
            <input type="text" name="campo_cnpj" placeholder="00.000.000/0001-00" required>

            <label>CEP</label>
            <input type="text" name="campo_cep" placeholder="00000-000" required>

            <button type="submit">Salvar</button>
        </form>

        <div class="terminal-logs">
            <div class="terminal-topo">
                <span class="circulo vermelho"></span>
                <span class="circulo amarelo"></span>
                <span class="circulo verde"></span>
                <p class="terminal-titulo">CORN_TERMINAL_V2.0.exe</p>
            </div>
            <div class="terminal-conteudo" id="log-texto">
                <p class="log-linha">[STATUS] Aguardando dados de entrada...</p>
            </div>
        </div>
        
        <hr>
        <a href="/">Voltar à Página Anterior</a>

        <p>CornTeam</p>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
